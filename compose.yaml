services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-sie_juridicos}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}'
      - 'POSTGRES_USER=${POSTGRES_USER:-sie_user}'
    ports:
      # Solo localhost: sin el prefijo 127.0.0.1, Docker publica en 0.0.0.0 por defecto,
      # es decir Postgres queda alcanzable desde cualquier otro equipo en la misma red
      # (relevante en un portátil de desarrollo en wifi compartida/de oficina). La app
      # sigue conectándose igual, vía jdbc:postgresql://localhost:5432.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - 'sie_juridicos_data:/var/lib/postgresql/data'

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-pgadmin@siejuridicos.com}'
      - 'PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}'
    ports:
      # Mismo motivo que Postgres arriba: pgAdmin no debería quedar alcanzable fuera de
      # esta máquina.
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - 'pgadmin_data:/var/lib/pgadmin'
      - './pgadmin/servers.json:/pgadmin4/servers.json:ro'
    depends_on:
      - postgres

volumes:
  sie_juridicos_data:
  pgadmin_data:
