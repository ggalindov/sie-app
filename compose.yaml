services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-sie_juridicos}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}'
      - 'POSTGRES_USER=${POSTGRES_USER:-sie_user}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - 'sie_juridicos_data:/var/lib/postgresql/data'

  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
      - 'PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-pgadmin@siejuridicos.com}'
      - 'PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - 'pgadmin_data:/var/lib/pgadmin'
      - './pgadmin/servers.json:/pgadmin4/servers.json:ro'
    depends_on:
      - postgres

volumes:
  sie_juridicos_data:
  pgadmin_data:
