# Stack completo de producción: Postgres + backend + frontend + Caddy (proxy reverso con
# HTTPS automático vía Let's Encrypt). Uso: ver DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# No incluye pgAdmin a propósito (es una herramienta de desarrollo; correrla 24/7 en el
# VPS solo gastaría RAM sin necesidad — para administrar la base de datos en producción,
# usa un túnel SSH puntual hacia el puerto de Postgres cuando de verdad lo necesites).
#
# "name" fijo es imprescindible, no cosmético: sin él, Compose deriva el nombre del
# proyecto del nombre de la carpeta, que es el mismo para compose.yaml (el stack de
# desarrollo). En una máquina donde ambos archivos coexisten (como al verificar esto
# antes de un despliegue real), eso hace que Compose trate ambos stacks como EL MISMO
# proyecto y reutilice/recree contenedores y volúmenes del otro — en verificación se
# confirmó en vivo que esto reemplaza el contenedor de Postgres de desarrollo por uno
# con la config de producción (mismo volumen de datos, así que no hay pérdida de
# información, pero sí se pierde el mapeo de puerto hacia el host y el backend de
# desarrollo se queda sin poder conectarse hasta recrearlo de nuevo con compose.yaml).
name: sie-juridicos-prod

services:
  postgres:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - sie_juridicos_data:/var/lib/postgresql/data
    networks:
      - sie_red
    mem_limit: ${POSTGRES_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: &default-logging
      driver: json-file
      options:
        # Rotación de logs: sin esto, un contenedor de larga duración puede llenar el
        # disco del VPS solo con su propio stdout/stderr acumulado durante meses.
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_ADMIN=${MAIL_ADMIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FIRMA_WHATSAPP_URL=${FIRMA_WHATSAPP_URL}
      - FIRMA_SITIO_WEB=https://${DOMAIN}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN}
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
      # Ruta FIJA dentro del contenedor, no un valor de .env.prod: Compose monta el secreto
      # ahí abajo (ver "secrets:" de este servicio), con permisos 0444 de solo lectura, sin
      # pasar el contenido de la llave por una variable de entorno (docker inspect / los
      # logs de arranque de un proceso pueden filtrar variables de entorno más fácilmente
      # que un archivo montado con permisos restringidos).
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/run/secrets/google_sheets_credentials
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_TEMPLATE_NAME=${WHATSAPP_TEMPLATE_NAME:-notificacion_radicado}
      # Cobros Pendientes: hoja DISTINTA a la de casos, misma llave de cuenta de servicio
      # (GOOGLE_SHEETS_CREDENTIALS_PATH de arriba) pero con permiso de Editor otorgado sobre
      # esta hoja específica (ver DEPLOY.md).
      - GOOGLE_SHEETS_COBROS_ID=${GOOGLE_SHEETS_COBROS_ID}
      - WHATSAPP_TEMPLATE_COBRO_NAME=${WHATSAPP_TEMPLATE_COBRO_NAME:-recordatorio_cobro}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      # Aviso interno de nueva solicitud (formulario público) a la línea de la firma.
      - WHATSAPP_TEMPLATE_SOLICITUD_NAME=${WHATSAPP_TEMPLATE_SOLICITUD_NAME:-nueva_solicitud}
      - WHATSAPP_ADMIN_NUMERO=${WHATSAPP_ADMIN_NUMERO:-+573124781583}
    secrets:
      - google_sheets_credentials
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sie_red
    mem_limit: ${BACKEND_MEM_LIMIT:-640m}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # SOLO el origen, sin "/api" al final: cada llamada del código ya agrega su
        # propio "/api/..." a la ruta (ver frontend/src/lib/api.ts y admin-api.ts), igual
        # que API_URL_INTERNAL más abajo (que tampoco lo lleva). Bug real encontrado en
        # producción: con "/api" ya incluido aquí, cada petición del navegador terminaba
        # pidiendo "/api/api/..." (404/401 según la ruta) -- rompía en silencio TODO lo
        # que se envía desde el navegador: login del panel admin, formulario de
        # contacto, chatbot, testimonios, boletín. Nunca se detectó antes porque las
        # verificaciones con curl le pegaban directo a la ruta correcta del backend
        # (sin pasar por este código del navegador), y las pruebas en navegador de la
        # sesión eran contra localhost en desarrollo, donde esta variable no lleva
        # "/api" y por eso nunca reproducía el bug.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      # Variable normal (sin prefijo NEXT_PUBLIC_): solo la lee el servidor en tiempo de
      # ejecución, nunca llega al bundle del navegador. Los renders de servidor (listado
      # y detalle del blog) le hablan directo al backend por la red interna en vez de
      # salir a Internet y volver a entrar vía Caddy en cada request (ver lib/api.ts).
      - API_URL_INTERNAL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sie_red
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    healthcheck:
      # 127.0.0.1, no "localhost": la imagen del frontend (Alpine) resuelve
      # "localhost" solo a ::1 (IPv6) en /etc/hosts, y el servidor de Next.js
      # standalone solo escucha en IPv4 (0.0.0.0) -- con "localhost" el
      # healthcheck fallaba con "Connection refused" pese a que el servidor
      # sí estaba arriba y respondiendo, confirmado en vivo con
      # docker exec + wget contra ambas direcciones.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  caddy:
    image: 'caddy:2-alpine'
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - sie_red
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging: *default-logging

networks:
  # Subred fija (no la que Docker asignaría al azar) para que
  # server.tomcat.remoteip.trusted-proxies en application-prod.properties pueda confiar
  # en "vengo de esta red interna" sin tener que confiar en cualquier IP.
  sie_red:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  sie_juridicos_data:
  caddy_data:
  caddy_config:

secrets:
  # Llave de la cuenta de servicio de Google (solo lectura, ver HojaCalculoConfig) que lee
  # el Google Sheets de casos. "file:" (secreto de archivo, no de Swarm) funciona con
  # "docker compose" normal, sin necesidad de modo Swarm: Compose monta este archivo dentro
  # del contenedor del backend en /run/secrets/google_sheets_credentials, de solo lectura y
  # sin exponer su contenido como variable de entorno. La ruta es relativa a este archivo
  # (la raíz del repo en el VPS); ver DEPLOY.md para dónde colocar el archivo real.
  google_sheets_credentials:
    file: ./secrets/google-sheets-service-account.json
