# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod (ver Dockerfile).
# Solo contiene lo que de verdad cambia respecto a application.properties (que sigue
# siendo la base para todos los perfiles); todo lo demás (Hikari, Tomcat, JWT, límites
# del chatbot, etc.) ya está parametrizado por variables de entorno y no necesita
# duplicarse aquí.

# El starter de docker-compose (arranca/apaga Postgres automáticamente, ver run.bat)
# es solo para desarrollo local: en producción, docker-compose.prod.yml ya gestiona el
# ciclo de vida de todos los contenedores, y dejar este módulo activo haría que la propia
# app intente hablarle al socket de Docker dentro de su contenedor (no tiene sentido ni
# acceso a él).
spring.docker.compose.enabled=false

# La compresión de respuesta se hace UNA sola vez, en el borde (Caddy, ver Caddyfile:
# "encode gzip zstd"), no aquí también: Caddy es el único punto de salida real hacia
# Internet tanto del backend como del frontend, así que comprimir además en Tomcat
# gastaría CPU dos veces por la misma respuesta sin ahorrar más ancho de banda.

# Detrás de Caddy (ver docker-compose.prod.yml/Caddyfile): Tomcat corrige
# request.getRemoteAddr() usando X-Forwarded-For/X-Forwarded-Proto SOLO cuando la
# conexión TCP real viene de la IP del propio contenedor de Caddy (trusted-proxies), tal
# como ya anticipaba el comentario de RateLimitFilter.obtenerIp(). Sin esto, todo el
# tráfico real llegaría con la IP interna de Caddy y el rate limiting por IP dejaría de
# tener sentido (todo el mundo compartiría el mismo contador).
server.forward-headers-strategy=native
# Red fija de docker-compose.prod.yml (ver "sie_red"): solo esa subred puede actuar como
# proxy de confianza, nunca una IP arbitraria de Internet.
server.tomcat.remoteip.trusted-proxies=172\\.28\\.0\\.\\d{1,3}

# Menos ruido en logs = menos I/O de disco y menos CPU formateando líneas que nadie va a
# leer en operación normal. SQL/parámetros de Hibernate y el "banner" de arranque son los
# más ruidosos y solo tienen valor en desarrollo.
spring.jpa.properties.hibernate.format_sql=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.sie.siejuridicos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Next.js standalone (ver frontend/next.config.ts) sirve sus propios assets estáticos:
# el origen de la API no necesita servir nada más que JSON, así que no hay nada que
# cachear/comprimir aparte de las respuestas normales ya cubiertas arriba.
