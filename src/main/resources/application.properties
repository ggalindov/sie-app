spring.application.name=sie-juridicos

# Base de datos. DB_HOST default "localhost" para desarrollo local (run.bat); en
# docker-compose.prod.yml se sobreescribe a "postgres" (el nombre del servicio en la red
# interna de Docker, donde "localhost" apuntaría al propio contenedor del backend, no a
# la base de datos).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sie_juridicos}
spring.datasource.username=${DB_USER:sie_user}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP: valores explícitos en vez de depender de los defaults implícitos de Spring
# Boot. connection-timeout bajo (8s) para que, si Postgres se cae o el pool se agota,
# la petición falle rápido con un 503 controlado (ver GlobalExceptionHandler) en vez de
# dejar al cliente esperando hasta el timeout por defecto de 30s.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# Tomcat embebido: límites explícitos para acotar el consumo de memoria/hilos ante un
# pico de tráfico o un intento simple de agotar conexiones (distinto del rate limiting
# por IP, que limita frecuencia por cliente, no el total de conexiones concurrentes).
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.connection-timeout=20000

# JPA / Hibernate: el esquema lo gestiona Flyway, Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Evita N+1 al listar artículos (categoria/autor son @ManyToOne LAZY): en vez de una
# consulta extra por cada fila, Hibernate agrupa hasta 25 ids por consulta batch tanto en
# ArticuloService.listarTodos (findAll) como en ArticuloRepository.buscarPublicados
# (query nativa, no admite @EntityGraph/JOIN FETCH junto con la búsqueda de texto completo).
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-de-al-menos-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Chatbot: tope de conversaciones nuevas por mes calendario (no de mensajes; ver
# fn_contar_conversaciones_mes_actual y ChatbotService.obtenerOCrearConversacion).
# Alcanzado el tope, el chatbot responde de inmediato pidiendo continuar por WhatsApp,
# sin llamar a la API de Anthropic (no genera costo). 500 es un techo generoso para el
# volumen actual del sitio; bájalo aquí si algún mes se acerca al límite y quieres
# apretar el costo aún más.
app.chatbot.limite-mensual=${CHATBOT_LIMITE_MENSUAL:250}

# Cupo diario COMPARTIDO de envíos masivos (correo + WhatsApp) entre casos, cobros y cualquier
# otro envío en bloque (ver common.limite.LimiteEnvioMasivoService) -- pedido explícito del
# usuario: WhatsApp Business tiene un límite real de mensajes salientes por día (250 en la
# cuenta actual). Un envío masivo manual que exceda el cupo procesa hasta este número de
# destinatarios y deja el resto pendiente para el día siguiente, sin perder a nadie. Súbelo aquí
# si Meta aumenta el límite de la cuenta (la calificación de calidad/volumen de WhatsApp
# Business crece con el tiempo de uso).
app.envios-masivos.limite-diario=${ENVIOS_MASIVOS_LIMITE_DIARIO:250}

# FAQ auto-alimentada: cantidad de veces que debe repetirse la misma pregunta (normalizada,
# texto exacto) antes de aparecer como candidata en /admin/faq. Ver PreguntaFrecuenteService.
# Bajado de 3 a 1 -- pedido explícito del usuario: "la probabilidad de que se vuelva
# pregunta frecuente sea más fácil, para tener más preguntas frecuentes". Aprobarla y
# publicarla en /preguntas-frecuentes sigue siendo un paso manual del admin (ver
# PreguntaFrecuenteService.moderar()), así que bajar el umbral solo significa que más
# preguntas quedan visibles para revisar, nunca que se publican solas.
app.faq.umbral-candidata=${FAQ_UMBRAL_CANDIDATA:1}

# Spring AI / Anthropic (Claude Haiku, el modelo más económico de la familia Claude,
# según lo definido en el alcance del proyecto). El max-tokens efectivo por llamada lo
# decide ChatbotService.calcularMaxTokens() según el gasto acumulado del mes (ver bloque
# de presupuesto abajo); esta línea es solo el valor de arranque del ChatClient, en la
# práctica siempre se sobreescribe por llamada.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:500}
# Sin esto, una llamada colgada a la API de Anthropic no tenía límite de tiempo: bajo
# carga, eso puede agotar el pool de hilos de Tomcat (cada request al chatbot ocupa un
# hilo mientras espera). max-retries bajo porque un reintento automático ya se sale del
# timeout total percibido por el usuario.
spring.ai.anthropic.timeout=${ANTHROPIC_TIMEOUT:25s}
spring.ai.anthropic.max-retries=${ANTHROPIC_MAX_RETRIES:1}

# Presupuesto mensual real del chatbot (gobernador de costo, ver ChatbotService).
# Se mide el gasto real (tokens que Anthropic reporta en cada respuesta), no una
# estimación: 9 USD = 9,000,000 micro-USD. Tarifas de Claude Haiku 4.5 verificadas en
# agosto 2026: USD 1 / millón de tokens de entrada, USD 5 / millón de tokens de salida
# (ver https://www.anthropic.com/claude/haiku). Si Anthropic cambia el precio, ajusta
# aquí, no en el código. A medida que se acerca el presupuesto, las respuestas se
# acortan (menos tokens de salida = menos costo) en vez de cortarse de golpe; solo se
# corta la llamada a la API por completo al llegar al 97% del presupuesto.
app.chatbot.presupuesto-mensual-micro-usd=${CHATBOT_PRESUPUESTO_MENSUAL_USD_X1M:5000000}
app.chatbot.costo-entrada-micro-usd-por-token=${CHATBOT_COSTO_ENTRADA_POR_TOKEN:1}
app.chatbot.costo-salida-micro-usd-por-token=${CHATBOT_COSTO_SALIDA_POR_TOKEN:5}
app.chatbot.max-tokens-normal=${CHATBOT_MAX_TOKENS_NORMAL:500}
app.chatbot.max-tokens-reducido=${CHATBOT_MAX_TOKENS_REDUCIDO:220}
app.chatbot.max-tokens-minimo=${CHATBOT_MAX_TOKENS_MINIMO:110}

# Alta del primer ADMIN_GENERAL (no hay registro público). Se omite si no se configuran.
app.admin-bootstrap.correo=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.contrasena=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.nombre=${ADMIN_BOOTSTRAP_NOMBRE:Administrador General}

# Correo saliente (SMTP). Sin MAIL_USERNAME/MAIL_PASSWORD el envío falla en tiempo de
# ejecución (no al arrancar la app) — se deja así hasta que existan credenciales reales.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Datos de la firma usados en las plantillas de correo
app.correo.remitente=${MAIL_FROM:siejuridicos@gmail.com}
app.correo.admin=${MAIL_ADMIN:siejuridicos@gmail.com}
# A quién avisar quién debe subir cada blog/noticia recién publicado a las redes sociales de
# la firma (ver ArticuloService.notificarPublicacion / EmailService.enviarAvisoRedesSociales)
# -- pedido explícito del usuario. Separado de app.correo.admin a propósito: hoy es la misma
# persona, pero el aviso de redes no tiene por qué ir siempre a la misma bandeja que las
# notificaciones administrativas del sitio.
app.redes-sociales.correo-aviso=${CORREO_AVISO_REDES:juagdg12@gmail.com}
# Los valores con tilde de esta sección se escriben con el escape \uXXXX (no la letra
# acentuada literal): el cargador clásico de .properties de Java (y el que usa Spring
# Boot para application.properties) asume ISO-8859-1 salvo que el valor venga escapado
# así, sin importar que el archivo en disco esté guardado en UTF-8 real. Sin este escape,
# el valor queda corrompido en memoria ("SIE JurÃ­dicos") y ese texto roto se propaga a
# todo lo que use app.firma.nombre: el remitente y el cuerpo de cada correo transaccional
# (ver EmailService), el nombre mostrado en el sitio, etc. Bug real detectado en vivo:
# los correos de prueba llegaban con "SIE JurÃ­dicos" tanto en el remitente como en el
# cuerpo del mensaje.
app.firma.nombre=SIE Jur\u00EDdicos
app.firma.whatsapp=${FIRMA_WHATSAPP_URL:}
app.firma.sitio-web=${FIRMA_SITIO_WEB:https://siejuridicos.com}
app.firma.telefono=${FIRMA_TELEFONO:+57 324 366 8845}
app.firma.ciudad=${FIRMA_CIUDAD:Bogot\u00E1 D.C., Colombia}

# Recordatorio de citas: cada 5 minutos, revisa si hay alguna reunión a menos de 1 hora de
# empezar (pedido explícito del usuario: "1 hora antes... siempre", ver
# RecordatorioCitaScheduler). Antes era una vez al día a las 7am -- 5 minutos es lo bastante
# frecuente para que ninguna reunión se quede sin su ventana de recordatorio, y lo bastante
# espaciado para no generarle carga real a la base de datos.
app.recordatorios.cron=${RECORDATORIOS_CRON:0 */5 * * * *}

# CORS: orígenes permitidos a consumir la API (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google Sheets donde la firma lleva el seguimiento real de sus casos (ver
# HojaCalculoService, solo lectura). Sin estos dos valores, /api/casos/consulta responde
# "servicio no disponible" en vez de fallar el arranque de la app.
app.hoja-calculo.spreadsheet-id=${GOOGLE_SHEETS_ID:}
app.hoja-calculo.credenciales-path=${GOOGLE_SHEETS_CREDENTIALS_PATH:}

# Sincronización automática de casos (ver SincronizacionCasosScheduler): antes esto era
# 100% manual (botón "Actualizar" de /admin/casos), así que un radicado recién asignado por
# el despacho en la hoja podía quedarse sin reflejarse en el sistema indefinidamente hasta
# que un admin entrara al panel. Cada 30 minutos es un margen razonable entre frescura de
# los datos y cuota de la API de Google Sheets (una lectura completa de las tres pestañas,
# no una por radicado).
app.casos.sincronizacion-cron=${CASOS_SINCRONIZACION_CRON:0 */30 * * * *}

# Llave maestra (32 bytes en Base64) para cifrar en la base de datos los datos de clientes y
# notas internas de casos (ver CifradoService). El valor de aquí abajo es SOLO para que el
# proyecto funcione sin configuración en desarrollo local -- mismo criterio que
# app.jwt.secret. Genera una real para producción con: openssl rand -base64 32
app.cifrado.clave=${DATA_ENCRYPTION_KEY:iaqdbNcpN64M+PvJFy5C1BfsKmxJk1ymfJMfbXs8Igg=}

# Notificación del radicado también por WhatsApp (línea de atención de la firma, ver
# WhatsAppService), vía la API oficial de Meta (WhatsApp Cloud API). Sin ACCESS_TOKEN /
# PHONE_NUMBER_ID, la notificación se sigue enviando por correo con normalidad, solo que sin
# WhatsApp -- ver DEPLOY.md para la guía completa de configuración en Meta Business Manager.
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Nombre EXACTO de la plantilla ya aprobada por Meta (ver DEPLOY.md) -- no texto libre, la
# API de WhatsApp lo rechaza si el nombre no coincide con una plantilla aprobada.
app.whatsapp.plantilla-nombre=${WHATSAPP_TEMPLATE_NAME:notificacion_radicado}
app.whatsapp.plantilla-idioma=${WHATSAPP_TEMPLATE_LANG:es_CO}
app.whatsapp.header-image-url=${WHATSAPP_HEADER_IMAGE_URL:https://siejuridicos.com/marca/logo.png}

# Plantilla de WhatsApp del recordatorio de cobro (con botones de respuesta rápida Sí/No,
# ver WhatsAppService.enviarRecordatorioCobro), DISTINTA de la de radicado -- debe aprobarse
# aparte en Meta Business Manager (ver DEPLOY.md).
app.whatsapp.plantilla-cobro-nombre=${WHATSAPP_TEMPLATE_COBRO_NAME:recordatorio_cobro}

# Aviso interno (no al cliente): apenas llega una solicitud nueva del formulario público, se
# manda un WhatsApp con el resumen completo a la línea interna de la firma (admin-numero),
# DISTINTA de las plantillas de radicado/cobro -- debe aprobarse aparte en Meta Business
# Manager (ver DEPLOY.md). admin-numero es fijo, pedido explícito del usuario.
app.whatsapp.plantilla-solicitud-nombre=${WHATSAPP_TEMPLATE_SOLICITUD_NAME:nueva_solicitud}
app.whatsapp.admin-numero=${WHATSAPP_ADMIN_NUMERO:+573124781583}

# Plantilla de confirmación de reunión agendada desde el calendario (ver
# SolicitudService.agendarCita / WhatsAppService.enviarConfirmacionCita), DISTINTA de las de
# radicado/cobro/solicitud -- debe aprobarse aparte en Meta Business Manager (ver DEPLOY.md)
# antes de que el envío real funcione en producción.
app.whatsapp.plantilla-cita-nombre=${WHATSAPP_TEMPLATE_CITA_NAME:confirmacion_cita}
# Aviso de blog/noticia publicado (ver ArticuloService.notificarPublicacion /
# WhatsAppService.enviarAvisoBlogPublicado) -- a diferencia de las demás notificaciones de
# WhatsApp, esta es de TEXTO LIBRE, no de plantilla (pedido explícito del usuario: un único
# destinatario interno fijo, no hace falta aprobación de Meta), así que no necesita su propia
# variable de nombre de plantilla. numero-aviso-blog es ese único número fijo, no el de un
# cliente ni el de atención general de la firma (ver admin-numero arriba). Sujeto a la
# limitación real de la propia API de WhatsApp: solo se entrega mientras ese número tenga una
# ventana de servicio abierta (le haya escrito algo al número de la firma en las últimas 24h).
app.whatsapp.numero-aviso-blog=${WHATSAPP_NUMERO_AVISO_BLOG:3126029742}
# Reporte semanal de caso (ver CasoService.enviarReporteSemanal / DEPLOY.md) -- plantilla
# DISTINTA de notificacion_radicado, debe aprobarse aparte en Meta Business Manager.
app.whatsapp.plantilla-reporte-semanal-nombre=${WHATSAPP_TEMPLATE_REPORTE_SEMANAL_NAME:reporte_semanal_caso}
# Corre TODOS los días a las 8:00 a.m. hora del servidor (ya fijada a America/Bogota, ver
# SieJuridicosApplication), no solo los lunes -- desde que existe el cupo diario compartido de
# envíos masivos (ver LimiteEnvioMasivoService), un lote grande de clientes puede no alcanzar a
# procesarse en un solo día. CasoService.enviarReporteSemanal() ya filtra por
# fechaUltimoReporteSemanal, así que un día sin pendientes de esta semana simplemente no envía
# nada -- correr a diario es lo que permite recoger automáticamente al día siguiente a quien
# quedó pendiente por el límite, en vez de esperar hasta el próximo lunes.
app.casos.reporte-semanal-cron=${CASOS_REPORTE_SEMANAL_CRON:0 0 8 * * *}

# Verifica el handshake de suscripción del webhook (GET) y la firma de cada evento entrante
# (POST, header X-Hub-Signature-256) -- ver whatsapp.WhatsAppWebhookController. Sin estos dos
# valores el webhook rechaza toda solicitud entrante.
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# Google Sheets de cobros pendientes (lectura Y escritura, ver HojaCobrosService), DISTINTO
# del de casos: propia hoja, propio ID, mismas credenciales de cuenta de servicio pero con
# permiso de Editor otorgado solo sobre esta hoja.
app.hoja-cobros.spreadsheet-id=${GOOGLE_SHEETS_COBROS_ID:}

# Recordatorio de cobro: corre TODOS los días a esta hora (formato cron de Spring), ver
# cobro.RecordatorioCobroScheduler y CobroService.enviarRecordatorios() -- antes corría solo el
# día 1 del mes, pero con el cupo diario compartido de envíos masivos (ver
# LimiteEnvioMasivoService) un lote grande puede no alcanzar a completarse ese primer día. La
# propia consulta ya filtra por fechaUltimoRecordatorio del mes en curso, así que un día sin
# pendientes de este mes simplemente no envía nada -- correr a diario es lo que permite recoger
# al día siguiente a quien quedó pendiente por el límite, sin esperar hasta el próximo mes.
app.cobros.recordatorio-cron=${COBROS_RECORDATORIO_CRON:0 40 8 * * *}

# Límite de tamaño del archivo ANTES de procesarlo (ver ImagenArticuloService): acota cuánta
# memoria puede llegar a usar el redimensionado de una sola subida. 10 MB es generoso para
# una foto de celular sin editar; el archivo final que se guarda queda muchísimo más liviano
# porque siempre se recomprime (ver más abajo).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta donde se guardan las imágenes de portada subidas desde el computador (ver
# ImagenArticuloService), organizadas en una subcarpeta por mes (yyyy-MM) para poder borrar
# meses completos más adelante sin tener que identificar imagen por imagen. Ruta relativa
# ("uploads/articulos", relativa al directorio desde donde corre el proceso) sirve para
# desarrollo local; en producción se sobreescribe a una ruta absoluta dentro del volumen
# montado (ver IMAGENES_ARTICULOS_PATH en docker-compose.prod.yml) para que sobreviva a cada
# despliegue -- el filesystem del propio contenedor es efímero.
app.almacenamiento.imagenes-articulos=${IMAGENES_ARTICULOS_PATH:uploads/articulos}
