spring.application.name=sie-juridicos

# Bug real encontrado probando en vivo esta misma sesión (pedido del usuario: "el sistema
# nunca debe parar de buscar actualizaciones"): por defecto Spring Boot arranca el
# TaskScheduler de @Scheduled con UN SOLO hilo (spring.task.scheduling.pool.size=1
# implícito) -- TODOS los @Scheduled de la aplicación (los 3 ciclos continuos de vigilancia,
# más SincronizacionCasosScheduler, RecordatorioCitaScheduler, BoletinJudicialScheduler.
# purgar/digestDiario/digestClientesSemanal, etc.) comparten ese único hilo. Confirmado en
# vivo: con un solo hilo, mientras SeguimientoJudicialScheduler hace su corrida de ~1 hora,
# los ciclos nuevos de boletines y de detección de procesos simplemente NUNCA llegan a
# arrancar -- quedan en cola indefinidamente detrás del que ya está corriendo, justo lo
# opuesto de "nunca debe parar". 8 hilos es suficiente margen para que cada ciclo continuo
# tenga el suyo propio, con hilos de sobra para los crons puntuales (digest, purga, etc.)
# que nunca duran más que unos segundos.
spring.task.scheduling.pool.size=8

# Base de datos. DB_HOST default "localhost" para desarrollo local (run.bat); en
# docker-compose.prod.yml se sobreescribe a "postgres" (el nombre del servicio en la red
# interna de Docker, donde "localhost" apuntaría al propio contenedor del backend, no a
# la base de datos).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sie_juridicos}
spring.datasource.username=${DB_USER:sie_user}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP: valores explícitos en vez de depender de los defaults implícitos de Spring
# Boot. connection-timeout bajo (8s) para que, si Postgres se cae o el pool se agota,
# la petición falle rápido con un 503 controlado (ver GlobalExceptionHandler) en vez de
# dejar al cliente esperando hasta el timeout por defecto de 30s.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# Tomcat embebido: límites explícitos para acotar el consumo de memoria/hilos ante un
# pico de tráfico o un intento simple de agotar conexiones (distinto del rate limiting
# por IP, que limita frecuencia por cliente, no el total de conexiones concurrentes).
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.connection-timeout=20000

# JPA / Hibernate: el esquema lo gestiona Flyway, Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Evita N+1 al listar artículos (categoria/autor son @ManyToOne LAZY): en vez de una
# consulta extra por cada fila, Hibernate agrupa hasta 25 ids por consulta batch tanto en
# ArticuloService.listarTodos (findAll) como en ArticuloRepository.buscarPublicados
# (query nativa, no admite @EntityGraph/JOIN FETCH junto con la búsqueda de texto completo).
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-de-al-menos-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Chatbot: tope de conversaciones nuevas por mes calendario (no de mensajes; ver
# fn_contar_conversaciones_mes_actual y ChatbotService.obtenerOCrearConversacion).
# Alcanzado el tope, el chatbot responde de inmediato pidiendo continuar por WhatsApp,
# sin llamar a la API de Anthropic (no genera costo). 500 es un techo generoso para el
# volumen actual del sitio; bájalo aquí si algún mes se acerca al límite y quieres
# apretar el costo aún más.
app.chatbot.limite-mensual=${CHATBOT_LIMITE_MENSUAL:250}

# Modo de seguridad para pruebas locales: bloquea de forma absoluta el envío de WhatsApp,
# correos salientes y tareas programadas masivas hacia clientes reales.
# BUG REAL encontrado en esta auditoría (pedido explícito del usuario: "el envio de whatsapp
# de reporte de casos cada 15 dias... auditalo porque no se estan enviando"): el default true
# de aquí es correcto para desarrollo local, pero en producción NUNCA se había puesto
# BLOQUEO_TOTAL_CLIENTES=false -- ni en .env.prod ni en docker-compose.prod.yml. Resultado: los
# tres schedulers que dependen de este flag (RecordatorioCobroScheduler, ReporteSemanalCasosScheduler,
# RecordatorioCitaScheduler) se omitían en silencio TODOS LOS DÍAS desde que el sitio está en
# producción -- solo los botones manuales del panel funcionaban, porque llaman al Service
# directo sin pasar por el Scheduler que trae este chequeo. Corregido en docker-compose.prod.yml
# y .env.prod del VPS, ver DEPLOY.md.
app.bloqueo-total-clientes=${BLOQUEO_TOTAL_CLIENTES:true}

# Cupo diario COMPARTIDO de envíos masivos (correo + WhatsApp) entre casos, cobros y cualquier
# otro envío en bloque (ver common.limite.LimiteEnvioMasivoService) -- pedido explícito del
# usuario: WhatsApp Business tiene un límite real de mensajes salientes por día (250 en la
# cuenta actual). Un envío masivo manual que exceda el cupo procesa hasta este número de
# destinatarios y deja el resto pendiente para el día siguiente, sin perder a nadie. Súbelo aquí
# si Meta aumenta el límite de la cuenta (la calificación de calidad/volumen de WhatsApp
# Business crece con el tiempo de uso).
app.envios-masivos.limite-diario=${ENVIOS_MASIVOS_LIMITE_DIARIO:250}

# FAQ auto-alimentada: cantidad de veces que debe repetirse la misma pregunta (normalizada,
# texto exacto) antes de aparecer como candidata en /admin/faq. Ver PreguntaFrecuenteService.
# Bajado de 3 a 1 -- pedido explícito del usuario: "la probabilidad de que se vuelva
# pregunta frecuente sea más fácil, para tener más preguntas frecuentes". Aprobarla y
# publicarla en /preguntas-frecuentes sigue siendo un paso manual del admin (ver
# PreguntaFrecuenteService.moderar()), así que bajar el umbral solo significa que más
# preguntas quedan visibles para revisar, nunca que se publican solas.
app.faq.umbral-candidata=${FAQ_UMBRAL_CANDIDATA:1}

# Spring AI / Anthropic (Claude Haiku 5.5, modelo rápido y eficiente de la familia Claude,
# según lo definido en el alcance del proyecto). El max-tokens efectivo por llamada lo
# decide ChatbotService.calcularMaxTokens() según el gasto acumulado del mes (ver bloque
# de presupuesto abajo); esta línea es solo el valor de arranque del ChatClient, en la
# práctica siempre se sobreescribe por llamada.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:650}
# Sin esto, una llamada colgada a la API de Anthropic no tenía límite de tiempo: bajo
# carga, eso puede agotar el pool de hilos de Tomcat (cada request al chatbot ocupa un
# hilo mientras espera). max-retries bajo porque un reintento automático ya se sale del
# timeout total percibido por el usuario.
spring.ai.anthropic.timeout=${ANTHROPIC_TIMEOUT:25s}
spring.ai.anthropic.max-retries=${ANTHROPIC_MAX_RETRIES:1}

# Presupuesto mensual real del chatbot (gobernador de costo, ver ChatbotService). Pedido
# explícito del usuario: tope de 4 USD = 4,000,000 micro-USD. Límite de 250 conversaciones/mes.
# Prompt caching activo (CONVERSATION_HISTORY) reduce 90% de costo de tokens de entrada.
app.chatbot.presupuesto-mensual-micro-usd=${CHATBOT_PRESUPUESTO_MENSUAL_USD_X1M:4000000}
app.chatbot.costo-entrada-micro-usd-por-token=${CHATBOT_COSTO_ENTRADA_POR_TOKEN:1}
app.chatbot.costo-salida-micro-usd-por-token=${CHATBOT_COSTO_SALIDA_POR_TOKEN:5}
app.chatbot.max-tokens-normal=${CHATBOT_MAX_TOKENS_NORMAL:650}
app.chatbot.max-tokens-reducido=${CHATBOT_MAX_TOKENS_REDUCIDO:450}
app.chatbot.max-tokens-minimo=${CHATBOT_MAX_TOKENS_MINIMO:300}

# Alta del primer ADMIN_GENERAL (no hay registro público). Se omite si no se configuran.
app.admin-bootstrap.correo=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.contrasena=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.nombre=${ADMIN_BOOTSTRAP_NOMBRE:Administrador General}

# Correo saliente (SMTP). Sin MAIL_USERNAME/MAIL_PASSWORD el envío falla en tiempo de
# ejecución (no al arrancar la app) — se deja así hasta que existan credenciales reales.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Datos de la firma usados en las plantillas de correo
app.correo.remitente=${MAIL_FROM:siejuridicos@gmail.com}
app.correo.admin=${MAIL_ADMIN:siejuridicos@gmail.com}
# Copia obligatoria de toda respuesta manual que un abogado/admin mande desde el "buzón" de
# Solicitudes (ver EmailService.enviarRespuestaSolicitud) -- pedido explícito del usuario:
# gerencia siempre debe quedar copiada en lo que se le responde a un cliente, sin que quien
# responde tenga que acordarse de agregarla a mano cada vez.
app.correo.gerencia=${MAIL_GERENCIA:gerencia@siejuridicos.com}
# A quién avisar quién debe subir cada blog/noticia recién publicado a las redes sociales de
# la firma (ver ArticuloService.notificarPublicacion / EmailService.enviarAvisoRedesSociales)
# -- pedido explícito del usuario. Separado de app.correo.admin a propósito: hoy es la misma
# persona, pero el aviso de redes no tiene por qué ir siempre a la misma bandeja que las
# notificaciones administrativas del sitio.
app.redes-sociales.correo-aviso=${CORREO_AVISO_REDES:juagdg12@gmail.com}
# Los valores con tilde de esta sección se escriben con el escape \uXXXX (no la letra
# acentuada literal): el cargador clásico de .properties de Java (y el que usa Spring
# Boot para application.properties) asume ISO-8859-1 salvo que el valor venga escapado
# así, sin importar que el archivo en disco esté guardado en UTF-8 real. Sin este escape,
# el valor queda corrompido en memoria ("SIE JurÃ­dicos") y ese texto roto se propaga a
# todo lo que use app.firma.nombre: el remitente y el cuerpo de cada correo transaccional
# (ver EmailService), el nombre mostrado en el sitio, etc. Bug real detectado en vivo:
# los correos de prueba llegaban con "SIE JurÃ­dicos" tanto en el remitente como en el
# cuerpo del mensaje.
app.firma.nombre=SIE Jur\u00EDdicos
app.firma.whatsapp=${FIRMA_WHATSAPP_URL:}
app.firma.sitio-web=${FIRMA_SITIO_WEB:https://siejuridicos.com}
app.firma.telefono=${FIRMA_TELEFONO:+57 324 366 8845}
app.firma.ciudad=${FIRMA_CIUDAD:Bogot\u00E1 D.C., Colombia}

# Recordatorio de citas: cada 5 minutos, revisa si hay alguna reunión a menos de 1 hora de
# empezar (pedido explícito del usuario: "1 hora antes... siempre", ver
# RecordatorioCitaScheduler). Antes era una vez al día a las 7am -- 5 minutos es lo bastante
# frecuente para que ninguna reunión se quede sin su ventana de recordatorio, y lo bastante
# espaciado para no generarle carga real a la base de datos.
app.recordatorios.cron=${RECORDATORIOS_CRON:0 */5 * * * *}

# CORS: orígenes permitidos a consumir la API (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cloudflare Turnstile -- pedido explícito del usuario: "captcha al login". Cambiado de
# Google reCAPTCHA v2 (ver TurnstileService para el bug real que motivó el cambio: Brave
# Shields/ad-blockers bloqueaban el script de reCAPTCHA con HTTP 503, confirmado en vivo).
# Solo la clave SECRETA vive aquí; la clave de sitio (pública) va en el frontend. Vacío por
# defecto a propósito -- sin ella configurada el login sigue funcionando sin exigir
# captcha (ver TurnstileService.habilitado), para que un clon nuevo de este repo no quede
# con el login roto por falta de esta variable.
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Google Sheets donde la firma lleva el seguimiento real de sus casos (ver
# HojaCalculoService, solo lectura). Sin estos dos valores, /api/casos/consulta responde
# "servicio no disponible" en vez de fallar el arranque de la app.
app.hoja-calculo.spreadsheet-id=${GOOGLE_SHEETS_ID:}
app.hoja-calculo.credenciales-path=${GOOGLE_SHEETS_CREDENTIALS_PATH:}

# Sincronización automática de casos (ver SincronizacionCasosScheduler): antes esto era
# 100% manual (botón "Actualizar" de /admin/casos), así que un radicado recién asignado por
# el despacho en la hoja podía quedarse sin reflejarse en el sistema indefinidamente hasta
# que un admin entrara al panel. Cada 30 minutos es un margen razonable entre frescura de
# los datos y cuota de la API de Google Sheets (una lectura completa de las tres pestañas,
# no una por radicado).
app.casos.sincronizacion-cron=${CASOS_SINCRONIZACION_CRON:0 */30 * * * *}

# Llave maestra (32 bytes en Base64) para cifrar en la base de datos los datos de clientes y
# notas internas de casos (ver CifradoService). El valor de aquí abajo es SOLO para que el
# proyecto funcione sin configuración en desarrollo local -- mismo criterio que
# app.jwt.secret. Genera una real para producción con: openssl rand -base64 32
app.cifrado.clave=${DATA_ENCRYPTION_KEY:iaqdbNcpN64M+PvJFy5C1BfsKmxJk1ymfJMfbXs8Igg=}

# Notificación del radicado también por WhatsApp (línea de atención de la firma, ver
# WhatsAppService), vía la API oficial de Meta (WhatsApp Cloud API). Sin ACCESS_TOKEN /
# PHONE_NUMBER_ID, la notificación se sigue enviando por correo con normalidad, solo que sin
# WhatsApp -- ver DEPLOY.md para la guía completa de configuración en Meta Business Manager.
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Nombre EXACTO de la plantilla ya aprobada por Meta (ver DEPLOY.md) -- no texto libre, la
# API de WhatsApp lo rechaza si el nombre no coincide con una plantilla aprobada.
app.whatsapp.plantilla-nombre=${WHATSAPP_TEMPLATE_NAME:notificacion_radicado_caso}
app.whatsapp.plantilla-idioma=${WHATSAPP_TEMPLATE_LANG:es_CO}
app.whatsapp.header-image-url=${WHATSAPP_HEADER_IMAGE_URL:https://siejuridicos.com/marca/logo.png}

# Plantilla de WhatsApp del recordatorio de cobro (con botones de respuesta rápida Sí/No,
# ver WhatsAppService.enviarRecordatorioCobro), DISTINTA de la de radicado -- debe aprobarse
# aparte en Meta Business Manager (ver DEPLOY.md).
app.whatsapp.plantilla-cobro-nombre=${WHATSAPP_TEMPLATE_COBRO_NAME:recordatorio_cobro}

# Aviso interno (no al cliente): apenas llega una solicitud nueva del formulario público, se
# manda un WhatsApp con el resumen completo a la línea interna de la firma (admin-numero),
# DISTINTA de las plantillas de radicado/cobro -- debe aprobarse aparte en Meta Business
# Manager (ver DEPLOY.md). admin-numero es fijo, pedido explícito del usuario.
app.whatsapp.plantilla-solicitud-nombre=${WHATSAPP_TEMPLATE_SOLICITUD_NAME:nueva_solicitud}
app.whatsapp.admin-numero=${WHATSAPP_ADMIN_NUMERO:+573124781583}

# Plantilla de confirmación de reunión agendada desde el calendario (ver
# SolicitudService.agendarCita / WhatsAppService.enviarConfirmacionCita), DISTINTA de las de
# radicado/cobro/solicitud -- debe aprobarse aparte en Meta Business Manager (ver DEPLOY.md)
# antes de que el envío real funcione en producción.
app.whatsapp.plantilla-cita-nombre=${WHATSAPP_TEMPLATE_CITA_NAME:confirmacion_cita}
# Aviso de blog/noticia publicado (ver ArticuloService.notificarPublicacion /
# WhatsAppService.enviarAvisoBlogPublicado) -- enviado mediante plantilla oficial de Meta
# para entrega garantizada a numero-aviso-blog (3126029742) en cualquier momento.
app.whatsapp.plantilla-blog-nombre=${WHATSAPP_TEMPLATE_BLOG_NAME:reporte_blog_publicado}
app.whatsapp.numero-aviso-blog=${WHATSAPP_NUMERO_AVISO_BLOG:3126029742}
# Reporte semanal de caso (ver CasoService.enviarReporteSemanal / DEPLOY.md) -- plantilla
# DISTINTA de notificacion_radicado, debe aprobarse aparte en Meta Business Manager.
app.whatsapp.plantilla-reporte-semanal-nombre=${WHATSAPP_TEMPLATE_REPORTE_SEMANAL_NAME:reporte_semanal_caso}
# Motor de firma electrónica (ver sie.siejuridicos.documento): enlace de firma y código de
# verificación por WhatsApp para partes PERSONA_NATURAL que eligieron ese canal -- dos
# plantillas DISTINTAS, deben aprobarse aparte en Meta Business Manager antes de que estos
# envíos funcionen de verdad en producción (sin aprobar, Meta responde error y el flujo
# sigue con normalidad, mismo comportamiento con gracia del resto de esta clase).
app.whatsapp.plantilla-firma-enlace-nombre=${WHATSAPP_TEMPLATE_FIRMA_ENLACE_NAME:enlace_firma_documento}
# Corre TODOS los días a las 8:00 a.m. hora del servidor (ya fijada a America/Bogota, ver
# SieJuridicosApplication), no solo los lunes -- desde que existe el cupo diario compartido de
# envíos masivos (ver LimiteEnvioMasivoService), un lote grande de clientes puede no alcanzar a
# procesarse en un solo día. CasoService.enviarReporteSemanal() ya filtra por
# fechaUltimoReporteSemanal, así que un día sin pendientes de esta semana simplemente no envía
# nada -- correr a diario es lo que permite recoger automáticamente al día siguiente a quien
# quedó pendiente por el límite, en vez de esperar hasta el próximo lunes.
app.casos.reporte-semanal-cron=${CASOS_REPORTE_SEMANAL_CRON:0 0 10 * * *}

# Verifica el handshake de suscripción del webhook (GET) y la firma de cada evento entrante
# (POST, header X-Hub-Signature-256) -- ver whatsapp.WhatsAppWebhookController. Sin estos dos
# valores el webhook rechaza toda solicitud entrante.
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# Google Sheets de cobros pendientes (lectura Y escritura, ver HojaCobrosService), DISTINTO
# del de casos: propia hoja, propio ID, mismas credenciales de cuenta de servicio pero con
# permiso de Editor otorgado solo sobre esta hoja.
app.hoja-cobros.spreadsheet-id=${GOOGLE_SHEETS_COBROS_ID:}

# Recordatorio de cobro: corre TODOS los días a esta hora (formato cron de Spring), ver
# cobro.RecordatorioCobroScheduler y CobroService.enviarRecordatorios() -- antes corría solo el
# día 1 del mes, pero con el cupo diario compartido de envíos masivos (ver
# LimiteEnvioMasivoService) un lote grande puede no alcanzar a completarse ese primer día. La
# propia consulta ya filtra por fechaUltimoRecordatorio del mes en curso, así que un día sin
# pendientes de este mes simplemente no envía nada -- correr a diario es lo que permite recoger
# al día siguiente a quien quedó pendiente por el límite, sin esperar hasta el próximo mes.
app.cobros.recordatorio-cron=${COBROS_RECORDATORIO_CRON:0 40 8 * * *}

# Reinicio mensual de cobros (ver cobro.ReinicioMensualCobrosScheduler y
# CobroService.reiniciarEstadoMensual()): corre a las 00:10 del día 1 de cada mes, antes de que el
# recordatorio del día 3 empiece a enviar -- limpia pagoEsteMes/respondioMensaje de cualquier
# cliente cuya respuesta quedó de un mes anterior, tanto aquí como en el Google Sheets, para que
# no se arrastre el check de "ya pagó" del mes pasado.
app.cobros.reinicio-mensual-cron=${COBROS_REINICIO_MENSUAL_CRON:0 10 0 1 * *}

# Límite de tamaño del archivo ANTES de procesarlo (ver ImagenArticuloService): acota cuánta
# memoria puede llegar a usar el redimensionado de una sola subida. 10 MB es generoso para
# una foto de celular sin editar; el archivo final que se guarda queda muchísimo más liviano
# porque siempre se recomprime (ver más abajo). El motor de firma (ver abajo) necesita más
# margen: un PDF escaneado de varias páginas puede superar fácilmente los 10 MB, así que el
# límite real de multipart queda en 25 MB (DocumentoAdminController valida el tipo/tamaño
# específico de cada subida por su cuenta, este es solo el techo duro de Spring).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------------------------
# Motor de firma electrónica (ver sie.siejuridicos.documento, adaptado del motor de UCN,
# C:\Users\pc\Documents\motor-firma-para-SIE\LEEME.md). Gerencia sube un documento, el
# sistema inserta la firma del gerente y de los abogados asignados, y luego la de cada parte
# elegida de la biblioteca de contactos (crm_clientes), con toda la evidencia técnica que
# exige la Ley 527/1999, el Decreto 2364/2012 y la Ley 2213/2022.
# ---------------------------------------------------------------------------------------

# Raíz criptográfica propia del motor (ver DocumentoClaveMaestraService) -- SEPARADA de
# app.cifrado.clave a propósito, para que una filtración de un dominio no comprometa al
# otro. Trae un valor de desarrollo por defecto (mismo criterio que app.cifrado.clave,
# arriba) para que el proyecto funcione sin configurar nada en local; en producción DEBE
# cambiarse por una real: genera una con "openssl rand -base64 32" -- NUNCA la compartas
# entre entornos ni la copies de otro proyecto (ver advertencia de seguridad en el
# LEEME.md de la carpeta copiada).
app.documento.clave-maestra=${DOCUMENTO_FIRMA_CLAVE_MAESTRA:p3OoJq3wDtoAhgUy0Zt/4ysahY3RNZ3I/U8AFoDtf3A=}

# Sello de tiempo RFC 3161 contra TSAs públicas y reconocidas (DigiCert y Sectigo), sin
# registro ni API key -- ver Rfc3161TimestampClient. Nunca bloquea el sellado de un
# documento: si ninguna responde, el documento queda sellado igual (PAdES + firma de
# aplicación + HMAC), y Rfc3161RetryScheduler reintenta cada 30 minutos.
app.documento.rfc3161.habilitado=${DOCUMENTO_FIRMA_RFC3161_HABILITADO:true}
app.documento.rfc3161.url-primaria=${DOCUMENTO_FIRMA_RFC3161_URL_PRIMARIA:http://timestamp.digicert.com}
app.documento.rfc3161.url-secundaria=${DOCUMENTO_FIRMA_RFC3161_URL_SECUNDARIA:http://timestamp.sectigo.com}
app.documento.rfc3161.timeout-conexion-ms=${DOCUMENTO_FIRMA_RFC3161_TIMEOUT_CONEXION_MS:5000}
app.documento.rfc3161.timeout-lectura-ms=${DOCUMENTO_FIRMA_RFC3161_TIMEOUT_LECTURA_MS:8000}
app.documento.rfc3161.reintento-initial-delay-ms=${DOCUMENTO_FIRMA_RFC3161_REINTENTO_INITIAL_DELAY_MS:300000}
app.documento.rfc3161.reintento-fixed-delay-ms=${DOCUMENTO_FIRMA_RFC3161_REINTENTO_FIXED_DELAY_MS:1800000}

# OTP enviado a cada parte externa antes de poder capturar su firma (ver OtpService): 6
# dígitos, vence a los 10 minutos, 5 intentos antes de invalidarse, 60s de espera entre
# reenvíos (evita que reenviar reinicie el contador de intentos y permita recorrer todo el
# espacio de códigos), tope de 10 códigos por firmante por día.
app.documento.otp.ttl-minutos=${DOCUMENTO_FIRMA_OTP_TTL_MINUTOS:10}
app.documento.otp.intentos-maximos=${DOCUMENTO_FIRMA_OTP_INTENTOS_MAXIMOS:5}
app.documento.otp.reenvio-cooldown-segundos=${DOCUMENTO_FIRMA_OTP_REENVIO_COOLDOWN_SEGUNDOS:60}
app.documento.otp.maximo-codigos-diarios=${DOCUMENTO_FIRMA_OTP_MAXIMO_CODIGOS_DIARIOS:10}
# Intentos antes de bloquear la verificación de identidad (cédula/NIT) de una parte, ver
# PublicDocumentoFirmaService#verificarIdentidad.
app.documento.otp.intentos-identidad-maximos=${DOCUMENTO_FIRMA_INTENTOS_IDENTIDAD_MAXIMOS:5}

# Token del enlace de firma de cada parte (ver SignerTokenService): 32 bytes aleatorios,
# solo se guarda su hash, vence a los 7 días.
app.documento.token-firma-dias=${DOCUMENTO_FIRMA_TOKEN_FIRMA_DIAS:7}

# Recordatorios automáticos a una parte que no ha firmado (ver FirmaRecordatorioScheduler):
# cada 24h, máximo 3, el proceso completo expira (y anula el documento) a los 10 días sin
# que TODAS las partes hayan firmado.
app.documento.recordatorios.habilitado=${DOCUMENTO_FIRMA_RECORDATORIOS_HABILITADO:true}
app.documento.recordatorios.intervalo-horas=${DOCUMENTO_FIRMA_RECORDATORIOS_INTERVALO_HORAS:24}
app.documento.recordatorios.maximo=${DOCUMENTO_FIRMA_RECORDATORIOS_MAXIMO:3}
app.documento.recordatorios.expiracion-dias=${DOCUMENTO_FIRMA_RECORDATORIOS_EXPIRACION_DIAS:10}
app.documento.recordatorios.barrido-initial-delay-ms=${DOCUMENTO_FIRMA_RECORDATORIOS_INITIAL_DELAY_MS:600000}
app.documento.recordatorios.barrido-fixed-delay-ms=${DOCUMENTO_FIRMA_RECORDATORIOS_FIXED_DELAY_MS:900000}

# Escaneo proactivo de integridad de documentos ya sellados (ver DocumentIntegrityScanner):
# primer barrido a los 15 minutos de arrancar, luego cada hora (antes cada 6 horas -- pedido
# explícito del usuario de reducir la ventana de detección).
app.documento.integridad.escaneo-initial-delay-ms=${DOCUMENTO_FIRMA_INTEGRIDAD_INITIAL_DELAY_MS:900000}
app.documento.integridad.escaneo-fixed-delay-ms=${DOCUMENTO_FIRMA_INTEGRIDAD_FIXED_DELAY_MS:3600000}

# Ancla diaria de integridad (ver AnclaDiariaIntegridadScheduler): sella con RFC 3161 un hash
# agregado del estado de todo el historial de auditoría de ese día, como prueba externa
# adicional ante terceros. 2am, hora del servidor -- fuera del horario de atención real.
app.documento.ancla-diaria.cron=${DOCUMENTO_FIRMA_ANCLA_DIARIA_CRON:0 0 2 * * *}

# URL base pública del sitio para construir el enlace de firma que recibe cada parte
# (correo/WhatsApp) -- reusa el mismo valor que ya usa el resto del sistema.
app.documento.sitio-web=${DOCUMENTO_FIRMA_SITIO_WEB:${FIRMA_SITIO_WEB:https://siejuridicos.com}}

# Carpeta donde se guardan las imágenes de portada subidas desde el computador (ver
# ImagenArticuloService), organizadas en una subcarpeta por mes (yyyy-MM) para poder borrar
# meses completos más adelante sin tener que identificar imagen por imagen. Ruta relativa
# ("uploads/articulos", relativa al directorio desde donde corre el proceso) sirve para
# desarrollo local; en producción se sobreescribe a una ruta absoluta dentro del volumen
# montado (ver IMAGENES_ARTICULOS_PATH en docker-compose.prod.yml) para que sobreviva a cada
# despliegue -- el filesystem del propio contenedor es efímero.
app.almacenamiento.imagenes-articulos=${IMAGENES_ARTICULOS_PATH:uploads/articulos}

# Vigilancia judicial (ver sie.siejuridicos.vigilancia): endpoints PÚBLICOS, sin token ni API
# key, de la propia Rama Judicial. Validados en vivo el 2026-10-30 contra radicados reales
# de la firma antes de escribir el cliente (ver RamaJudicialCpnuClient,
# PublicacionesProcesalesClient y la memoria del proyecto). No son APIs documentadas
# oficialmente (no hay contrato ni SLA) -- por eso ambos clientes nunca lanzan, solo
# devuelven vacío ante cualquier fallo.
app.vigilancia.cpnu.url-base=${VIGILANCIA_CPNU_URL_BASE:https://consultaprocesos.ramajudicial.gov.co:448}
app.vigilancia.cpnu.timeout-conexion-ms=${VIGILANCIA_CPNU_TIMEOUT_CONEXION_MS:5000}
# Subido de 15000 a 30000 el 2026-11-01 -- mismo hallazgo real que en Publicaciones
# Procesales (ver su comentario abajo): la infraestructura de ramajudicial.gov.co comparte
# el mismo patrón de latencia alta variable, no solo Publicaciones Procesales.
app.vigilancia.cpnu.timeout-lectura-ms=${VIGILANCIA_CPNU_TIMEOUT_LECTURA_MS:30000}
app.vigilancia.publicaciones-procesales.url-base=${VIGILANCIA_PUBLICACIONES_URL_BASE:https://publicacionesprocesales.ramajudicial.gov.co}
# Subido de 15000 a 30000 el 2026-11-01 -- probado en vivo con curl, misma petición exacta
# (mismos headers) que usa PublicacionesProcesalesClient, contra los 7 despachos que fallaron
# con "Read timed out" en el ciclo nocturno: los 7 respondieron bien (HTTP 200, contenido
# real), pero 2 de 7 tardaron 16.2s y 26.5s -- ya por encima del timeout de 15s. El portal no
# estaba caído, tiene latencia real muy variable; 15s cortaba una fracción real de consultas
# válidas antes de que terminaran de responder. 30s absorbe esa variabilidad sin afectar el
# margen del ciclo nocturno (corre de madrugada, con horas de sobra antes del digest de 7am).
app.vigilancia.publicaciones-procesales.timeout-ms=${VIGILANCIA_PUBLICACIONES_TIMEOUT_MS:30000}

# SAMAI (Consejo de Estado y Tribunales Administrativos) -- pedido explícito del usuario:
# "implementa esto... SAMAI", gap real: hasta ahora el seguimiento 24/7 solo cubre la Rama
# Judicial ordinaria (CPNU), nunca la jurisdicción contencioso-administrativa. Validado en
# vivo el 2026-10-31 contra un radicado real del Consejo de Estado (ver SamaiClient). Mismo
# criterio de robustez que el CPNU: sin SLA, nunca lanza, solo devuelve vacío ante cualquier
# fallo.
app.vigilancia.samai.url-base=${VIGILANCIA_SAMAI_URL_BASE:https://samai.consejodeestado.gov.co}
app.vigilancia.samai.timeout-conexion-ms=${VIGILANCIA_SAMAI_TIMEOUT_CONEXION_MS:5000}
# Subido de 15000 a 30000 el 2026-11-01 -- mismo hallazgo real de latencia alta variable en
# toda la infraestructura del Estado (ver el comentario de publicaciones-procesales abajo).
app.vigilancia.samai.timeout-lectura-ms=${VIGILANCIA_SAMAI_TIMEOUT_LECTURA_MS:30000}

# Seguimiento judicial (CPNU/SAMAI, ver SeguimientoJudicialService): pausa real entre cada
# caso de la corrida (nunca en paralelo, nunca en ráfaga) -- sigue el mismo criterio de "no
# golpear un sistema público de un tercero sin necesidad" que ya usa
# CasoService.PAUSA_ENTRE_ENVIOS_MS para los envíos masivos. 10s entre cada caso (dos
# llamadas por caso, ver RamaJudicialCpnuClient) viene de un bloqueo real: con una pausa
# menor, la Rama Judicial empezó a responder HTTP 403 en TODAS las consultas (confirmado en
# vivo el 2026-10-30, ver la memoria del proyecto) -- un WAF detectó el tráfico como
# automatizado.
app.vigilancia.pausa-entre-casos-ms=${VIGILANCIA_PAUSA_ENTRE_CASOS_MS:10000}

# REDISEÑADO el 2026-10-31 -- pedido explícito del usuario: "ajusta el sistema para que eso
# nunca pase" (que dos de los tres procesos externos de abajo corran en paralelo). Antes,
# seguimiento judicial, búsqueda de boletines y detección de procesos nuevos eran TRES
# ciclos continuos/cron INDEPENDIENTES, cada uno con su propio temporizador -- nada impedía
# que coincidieran (automático con automático, o automático con un botón manual del panel),
# y confirmado en vivo esta misma sesión: lanzar seguimiento + boletines a la vez volvió a
# colgar Publicaciones Procesales con "Read timed out" en despachos que acababan de
# responder bien segundos antes en una prueba aislada -- el tráfico COMBINADO hacia la
# infraestructura de la Rama Judicial (WAF/CDN compartido entre subdominios
# *.ramajudicial.gov.co) dispara la misma protección anti-automatización que ya bloqueó al
# sistema antes.
#
# Ahora los tres pasan por VigilanciaExternaOrquestador, que los corre en SECUENCIA (nunca
# en paralelo entre ellos, ni automático con manual) UNA vez al día, de madrugada -- pedido
# explícito del usuario: "precisamente a esas horas el sistema esta en hora baja,
# practicamente ningun usuario, con eso nunca perdemos nada".
#
# MOVIDO de 11:00pm a 2:00pm el 2026-11-02 (antes: 1:00am -> 11:00pm el 2026-11-01). Analisis con
# datos reales: Publicaciones Procesales se degrada de noche. Timeouts en rachas (1:07-1:11am,
# 11:59pm-12:14am, 12:39-12:44am), y una hora entera (10-11pm) con 67 descargas de PDF abortadas;
# en la tarde (17:19-19:46) hubo solo 3 fallos aislados en 2.5 h. Control simultaneo medido a las
# 12:43am: mientras Publicaciones no daba ni un byte en 30 s, el CPNU respondio en 0.43 s y
# Google en 0.23 s -> el problema es de ese portal, no de la conexion local. El ciclo completo
# dura ~4.5 h, asi que arrancando a las 2:00pm termina ~6:30pm, dentro de la ventana estable.
# Provisional: la tabla portal_salud (sonda cada 10 min, ver PortalSaludSonda) acumula la curva
# de 24 h y GET /api/admin/vigilancia/portales/salud permite confirmar o ajustar esta hora.
# El digest de las 7am ya no repite la pasada de boletines si una termino hace menos de 20 h.
# MOVIDO a las 5:15 a. m. hora Colombia: ciclo profundo tras concluir mantenimientos nocturnos de la DEAJ/CSJ (5:00 a. m.)
# Recorridos de vigilancia externa (pedido explícito del usuario, 2026-11-04: "el sistema no
# debe de parar de hacer busquedas", "dejemoslo con espacios de 60 minutos entre uno y otro",
# "ajustalo despues de las 7am inicie hasta las 7pm"): un disparo cada hora en punto, de 7:00
# AM a 7:00 PM inclusive (13 intentos/día), en vez de los dos fijos anteriores (7am/1pm). El
# ciclo completo real puede tardar varias horas con la cartera actual de casos (ver el
# historial de este archivo más arriba) -- el mutex cicloEnCurso de VigilanciaExternaOrquestador
# ya hace que un disparo que llega con el ciclo anterior todavía en curso simplemente se
# ignore (sin encolar ni duplicar tráfico), así que este cron solo define la frecuencia MÁXIMA
# con la que se intenta arrancar un ciclo nuevo en cuanto el anterior libera el mutex, nunca
# una garantía de que corran 13 ciclos completos independientes por día.
app.vigilancia.ciclo-cron=${VIGILANCIA_CICLO_CRON:0 0 7-19 * * *}

# Reporte diario matutino de movimientos procesales y boletines a gerencia y abogados: 10:00 AM
app.vigilancia.boletin-digest-diario-cron=${VIGILANCIA_BOLETIN_DIGEST_DIARIO_CRON:0 0 10 * * *}
app.vigilancia.boletin-digest-cliente-cron=${VIGILANCIA_BOLETIN_DIGEST_CLIENTE_CRON:0 0 8 * * FRI}
app.vigilancia.envio-clientes-activo=${VIGILANCIA_ENVIO_CLIENTES_ACTIVO:false}
app.vigilancia.boletin-purga-cron=${VIGILANCIA_BOLETIN_PURGA_CRON:0 30 3 * * *}

# Pausa propia para Publicaciones Procesales, dentro del paso de boletines del ciclo
# nocturno -- NO compartida con pausa-entre-casos-ms (esa es la del CPNU, un portal
# distinto). Se sube a 20s (el doble de la del CPNU) porque Publicaciones Procesales
# demostró ser el más sensible de los dos al tráfico repetido (ver el bloqueo de esta misma
# sesión arriba). La causa real de esos colgados no era esta pausa (ver
# PublicacionesProcesalesClient: faltaban cabeceras de navegador real), pero se deja
# igual de conservadora -- no hay necesidad de apurar algo que ya corre en horas sin nadie
# mirando.
app.vigilancia.boletin-pausa-entre-casos-ms=${VIGILANCIA_BOLETIN_PAUSA_ENTRE_CASOS_MS:20000}

# Detección de procesos nuevos por nombre de cliente (pedido explícito del usuario:
# "implementa todas las mejoras identificadas", comparando contra Lupa Jurídica). Antes era
# semanal (cron, lunes 5am), luego un ciclo continuo propio -- ahora es el ÚLTIMO de los tres
# pasos del ciclo nocturno único (ver ciclo-nocturno-cron arriba y
# VigilanciaExternaOrquestador): es la búsqueda MENOS urgente de las tres (una demanda nueva
# contra un cliente que tarda unas horas más en aparecer es un daño mucho menor que un
# término que vence sin que nadie se entere), así que va al final, después de seguimiento y
# boletines. Reutiliza pausa-entre-casos-ms (mismo CPNU que el seguimiento judicial).

